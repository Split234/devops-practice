name: Maven CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]   # LTS версии
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven            # вкл. кэш Maven

      # Если pom.xml в корне:
      - name: Build & test
        run: mvn -B -e -DfailIfNoTests=false clean verify

      # Если проект в подпапке, например app/, замени шаг выше на:
      # - name: Build & test (subdir)
      #   run: mvn -B -e -DfailIfNoTests=false clean verify
      #   working-directory: app
