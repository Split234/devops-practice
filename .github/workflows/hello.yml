name: Hello CI

on:
  push:
    branches: [ "**" ]        # запуск при любом пуше
  pull_request:                # и на PR
  workflow_dispatch:           # кнопка "Run workflow" вручную

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello, $GITHUB_ACTOR! Repo: $GITHUB_REPOSITORY"
