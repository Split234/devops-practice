name: Hello CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello, ${{ github.actor }}! Repo: ${{ github.repository }}"
